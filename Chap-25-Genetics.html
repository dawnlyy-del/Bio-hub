<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基礎遺傳學測驗 - 專業生物科自學平台</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; line-height: 1.6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        .info-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; background: #e8f5e9; padding: 15px; border-radius: 8px; }
        .question-card { margin-bottom: 25px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .question-card p { font-weight: bold; margin-bottom: 10px; }
        .options-group { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        label:hover { color: #27ae60; }
        button { background: #27ae60; color: white; border: none; padding: 12px 25px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; }
        button:hover { background: #219150; }
        #resultArea { margin-top: 30px; display: none; }
        .explanation { background: #fff3cd; padding: 10px; margin-top: 10px; border-left: 5px solid #ffca28; font-size: 0.9em; border-radius: 4px; }
        .correct { color: #27ae60; font-weight: bold; }
        .wrong { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>基礎遺傳學自測 (HKDSE 程度)</h1>
    
    <form id="quizForm">
        <input type="hidden" name="access_key" value="9fdaad93-441f-48a8-a1b8-dfdfe439a468">
        <input type="hidden" name="subject" value="基礎遺傳學測驗成績匯報">
        <input type="hidden" name="from_name" value="Biology Quiz System">

        <div class="info-section">
            <div>
                <label>學生姓名:</label>
                <input type="text" name="student_name" required style="width:90%">
            </div>
            <div>
                <label>班別:</label>
                <input type="text" name="class" placeholder="例如: 4A" required style="width:90%">
            </div>
            <div>
                <label>學號:</label>
                <input type="text" name="student_id" required style="width:90%">
            </div>
        </div>

        <div id="questionsContainer"></div>
        
        <button type="submit" id="submitBtn">提交答案並計算得分</button>
    </form>

    <div id="resultArea">
        <h2 id="scoreDisplay"></h2>
        <div id="feedbackDetail"></div>
    </div>
</div>

<script>
const quizData = [
    { q: "1. 孟德爾(Mendel)遺傳定律中，分離定律(Law of Segregation)發生在什麼過程？", o: ["受精作用", "減數分裂", "有絲分裂", "細胞分化"], a: 1, e: "減數分裂過程中，一對等位基因互相分離並進入不同的配子中。" },
    { q: "2. 若一對表型正常的夫婦生下一個患有白化病(隱性遺傳病)的孩子，該夫婦的基因型分別是？", o: ["AA x AA", "AA x Aa", "Aa x Aa", "Aa x aa"], a: 2, e: "父母必須皆為雜合子(Aa)，才有可能各提供一個隱性等位基因(a)給後代。" },
    { q: "3. 人的 ABO 血型遺傳屬於哪種遺傳方式？", o: ["完全顯性", "不完全顯性", "複等位基因及等顯性", "性連鎖遺傳"], a: 2, e: "ABO 血型由 I^A, I^B, i 三個等位基因決定，且 I^A 與 I^B 為等顯性。" },
    { q: "4. 以下哪項關於等位基因(Alleles)的描述是正確的？", o: ["位於非同源染色體上", "位於同源染色體的相同位點", "基因序列完全相同", "只在配子中出現"], a: 1, e: "等位基因是指位於同源染色體上相同位置，控制同一性狀的不同形式的基因。" },
    { q: "5. 一個雜合紅花植物(Rr)與白花植物(rr)雜交，後代出現紅花的概率是？", o: ["25%", "50%", "75%", "100%"], a: 1, e: "Rr x rr 的結果為 1 Rr : 1 rr，因此紅花(Rr)概率為 50%。" },
    { q: "6. 性連鎖遺傳病（如紅綠色盲）的基因通常位於？", o: ["X 染色體", "Y 染色體", "第 21 對染色體", "線粒體 DNA"], a: 0, e: "大多數性連鎖遺傳病基因位於 X 染色體上，因此男性發病率較高。" },
    { q: "7. 在遺傳學中，「表型」(Phenotype) 是指：", o: ["生物的遺傳組成", "等位基因的組合", "生物可觀察到的特徵", "細胞核內的染色體數目"], a: 2, e: "表型是指基因型與環境相互作用後展現出來的特徵。" },
    { q: "8. 雙雜合子 (AaBb) 進行自交，若基因遵循自由組合定律，後代的表型比例為？", o: ["3:1", "1:2:1", "9:3:3:1", "1:1:1:1"], a: 2, e: "根據孟德爾第二定律，雙雜合子雜交的典型表型比為 9:3:3:1。" },
    { q: "9. 為什麼近親繁殖會增加後代患上遺傳病的風險？", o: ["增加突變率", "增加有害隱性等位基因純合的機會", "導致染色體數目異常", "減少配子的產生"], a: 1, e: "近親帶有相同隱性致病基因的機會較高，增加後代出現隱性純合子(aa)的可能性。" },
    { q: "10. 若 DNA 分子中 A (腺嘌呤) 佔 20%，則 G (鳥嘌呤) 佔多少？", o: ["20%", "30%", "40%", "80%"], a: 1, e: "根據鹼基配對，A=T=20%，則 C+G=60%，所以 G=30%。" }
];

const container = document.getElementById('questionsContainer');
quizData.forEach((data, index) => {
    let html = `<div class="question-card"><p>${data.q}</p><div class="options-group">`;
    data.o.forEach((opt, i) => {
        html += `<label><input type="radio" name="q${index}" value="${i}" required> ${opt}</label>`;
    });
    html += `</div><div id="exp${index}" class="explanation" style="display:none;"></div></div>`;
    container.innerHTML += html;
});

document.getElementById('quizForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    let score = 0;
    let reportSummary = "";

    quizData.forEach((data, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const expDiv = document.getElementById(`exp${index}`);
        const userAns = selected ? parseInt(selected.value) : -1;
        
        expDiv.style.display = "block";
        let statusText = "";

        if(userAns === data.a) {
            score++;
            statusText = "✅ 正確";
            expDiv.innerHTML = `<span class="correct">正確！</span> ${data.e}`;
        } else {
            statusText = "❌ 錯誤";
            expDiv.innerHTML = `<span class="wrong">答案是: ${data.o[data.a]}。</span> ${data.e}`;
        }
        reportSummary += `Q${index+1}: ${statusText} | 學生答案: ${data.o[userAns]} | 正確答案: ${data.o[data.a]}\nAI題解: ${data.e}\n\n`;
    });

    // 顯示結果
    document.getElementById('scoreDisplay').innerText = `你的得分: ${score} / 10`;
    document.getElementById('resultArea').style.display = "block";
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').innerText = "報告已傳送給老師";

    // 準備 Web3Forms 數據
    const formData = new FormData(this);
    formData.append("總分", score);
    formData.append("詳細報告", reportSummary);

    // 發送郵件
    await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        body: formData
    });
    
    alert("測驗完成！分數已顯示，結果已傳送至老師郵箱。");
});
</script>

</body>
</html>
