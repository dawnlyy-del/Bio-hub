<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 生物科：光合作用測驗 (AI 系統)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #f0fdf4; } /* Light green background */
        .question-card { background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 1.5rem; margin-bottom: 1.5rem; border-left: 4px solid #22c55e; }
        .loading { display: none; }
        .btn-loading .loading { display: inline-block; }
        .btn-loading .btn-text { display: none; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-12">

    <div class="max-w-4xl mx-auto pt-10 px-4">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-green-700 mb-2">🌿 HKDSE 生物科：光合作用專題測驗</h1>
            <p class="text-gray-600">設計者：光合作用 (生物科科主任) | 滿分：10分</p>
        </header>

        <!-- Main Form -->
        <form id="quizForm" class="space-y-6">
            
            <!-- Student Info Section -->
            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-green-600">
                <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">📋 學生資料</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">學生姓名</label>
                        <input type="text" id="studentName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="例如：陳大文">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">班別</label>
                        <input type="text" id="studentClass" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="例如：4A">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">學號</label>
                        <input type="text" id="studentNum" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="例如：01">
                    </div>
                </div>
            </div>

            <!-- Quiz Container -->
            <div id="quizContainer">
                <!-- Questions will be injected here by JavaScript -->
            </div>

            <!-- Submit Button -->
            <div class="text-center mt-8">
                <button type="submit" id="submitBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-200 transform hover:scale-105">
                    <span class="btn-text">完成測驗及提交</span>
                    <span class="loading">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        系統批改及生成 AI 題解中...
                    </span>
                </button>
            </div>
        </form>

        <!-- Results Section (Hidden initially) -->
        <div id="resultsSection" class="hidden mt-12 bg-white p-8 rounded-xl shadow-lg border-t-8 border-green-500">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">🎉 測驗完成！</h2>
                <div class="mt-4 inline-block bg-green-100 text-green-800 text-5xl font-extrabold py-6 px-12 rounded-2xl shadow-inner">
                    <span id="finalScore">0</span> / 10
                </div>
                <p class="mt-4 text-gray-600" id="submissionStatus">成績報告已成功傳送給科主任！請查閱下方 AI 題解。</p>
            </div>
            
            <div id="reportContainer" class="space-y-6 mt-8">
                <!-- Detailed results and AI explanations will be injected here -->
            </div>
        </div>

    </div>

    <script>
        // HKDSE Level Questions Data
        const questions = [
            {
                id: 1,
                q: "光反應（Light-dependent reactions）發生的位置是哪裡？",
                options: ["葉綠體基質 (Stroma)", "類囊體膜 (Thylakoid membrane)", "細胞質 (Cytoplasm)", "線粒體基質 (Mitochondrial matrix)"],
                ans: 1, // Index 1 is B
                ai: "光反應需要光能，而吸收光能的色素（主要是葉綠素）鑲嵌於葉綠體的類囊體膜上，因此光反應必須在類囊體膜上進行。"
            },
            {
                id: 2,
                q: "以下哪項是光反應的產物，並會被轉移至暗反應（卡爾文循環）中使用？",
                options: ["葡萄糖和氧氣", "ADP和NADP", "ATP和NADPH", "水和二氧化碳"],
                ans: 2,
                ai: "光反應透過電子傳遞鏈產生 ATP (提供能量)，並透過水的光解與 NADP+ 結合產生 NADPH (提供還原力)，兩者皆為推動暗反應碳固定所必需的物質。"
            },
            {
                id: 3,
                q: "在光合作用中，水的光解（Photolysis of water）會產生以下哪些物質？<br>&nbsp;&nbsp;(1) 氧氣<br>&nbsp;&nbsp;(2) 氫離子<br>&nbsp;&nbsp;(3) 葡萄糖",
                options: ["只有 (1) 和 (2)", "只有 (1) 和 (3)", "只有 (2) 和 (3)", "(1)、(2) 和 (3)"],
                ans: 0,
                ai: "水分子在光能的作用下分解，會產生氧氣（作為副產品釋放）、氫離子和電子。葡萄糖是暗反應中利用二氧化碳合成的產物，並非來自水的光解。因此只有 (1) 和 (2) 正確。"
            },
            {
                id: 4,
                q: "葉綠素在光合作用中的主要作用是甚麼？",
                options: ["吸收綠色光譜", "吸收光能並釋放高能電子", "催化二氧化碳的固定", "將水分子結合成葡萄糖"],
                ans: 1,
                ai: "葉綠素是主要的光合色素（呈現綠色是因為它反射綠光）。它的功能是吸收光能（特別是紅光和藍光），使其電子激發至高能狀態，啟動光反應。"
            },
            {
                id: 5,
                q: "在測試葉片是否含有澱粉的實驗中，將葉片放入熱酒精的目的是甚麼？",
                options: ["殺死葉片細胞", "破壞細胞膜及細胞壁", "提取葉綠素以進行脫色", "軟化葉片以便滴加碘液"],
                ans: 2,
                ai: "葉綠素不溶於水但溶於有機溶劑（如酒精）。將葉片放入熱酒精中可溶解並提取葉綠素，使葉片脫色，以免葉片的綠色遮蓋碘液測試澱粉時產生的藍黑色。"
            },
            {
                id: 6,
                q: "暗反應（卡爾文循環）主要在葉綠體的哪部分進行？",
                options: ["外膜", "內膜", "類囊體", "基質 (Stroma)"],
                ans: 3,
                ai: "暗反應不需要光，但需要光反應提供的 ATP 和 NADPH。催化暗反應所需的大量酶（酵素，如 Rubisco）富集於葉綠體基質中。"
            },
            {
                id: 7,
                q: "如果植物處於「補償點」（Compensation point），這意味著甚麼？",
                options: ["光合作用速率達到最高限制", "呼吸作用完全停止", "光合作用吸收二氧化碳的速率等於呼吸作用釋放二氧化碳的速率", "植物開始消耗自身的葡萄糖儲備"],
                ans: 2,
                ai: "「補償點」是指在特定光強度下，植物進行光合作用吸收二氧化碳（或釋放氧氣）的速率，剛好等於呼吸作用釋放二氧化碳（或吸收氧氣）的速率，淨氣體交換為零。"
            },
            {
                id: 8,
                q: "在暗反應的碳固定階段，二氧化碳會首先與哪種物質結合？",
                options: ["三碳化合物 (如 PGAL)", "五碳化合物 (RuBP)", "葡萄糖", "磷酸甘油酸 (PGA)"],
                ans: 1,
                ai: "在卡爾文循環的碳固定階段，一分子的二氧化碳會與一分子的五碳化合物（RuBP）結合，形成不穩定的六碳化合物，隨即分解為兩分子的三碳化合物。"
            },
            {
                id: 9,
                q: "植物在光合作用製造的糖分，通常以哪種形式在韌皮部（Phloem）中運輸？",
                options: ["葡萄糖", "澱粉", "蔗糖", "纖維素"],
                ans: 2,
                ai: "葡萄糖具水溶性但化學性質太活躍；澱粉不溶於水，適合儲存；而蔗糖具水溶性且化學性質相對穩定，因此植物主要以蔗糖形式運輸光合產物。"
            },
            {
                id: 10,
                q: "以下哪些通常是影響自然環境中光合作用速率的主要限制因素？<br>&nbsp;&nbsp;(1) 光強度<br>&nbsp;&nbsp;(2) 二氧化碳濃度<br>&nbsp;&nbsp;(3) 溫度",
                options: ["只有 (1) 和 (2)", "只有 (1) 和 (3)", "只有 (2) 和 (3)", "(1)、(2) 和 (3)"],
                ans: 3,
                ai: "在自然環境中，光強度提供光反應所需的能量，二氧化碳是暗反應的原料，而溫度則直接影響光合作用中各種酶（如 Rubisco）的活性。這三者都是常見的主要限制因素。"
            }
        ];

        const quizContainer = document.getElementById('quizContainer');
        const form = document.getElementById('quizForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultsSection = document.getElementById('resultsSection');
        const finalScoreEl = document.getElementById('finalScore');
        const reportContainer = document.getElementById('reportContainer');
        const submissionStatus = document.getElementById('submissionStatus');

        // Web3Forms Configuration
        const WEB3FORMS_ACCESS_KEY = "9453d578-c758-4d32-be40-fe19262ac8af";
        const TEACHER_EMAIL = "lyy@pohtyh.edu.hk";

        // Render Questions
        function renderQuiz() {
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 hover:bg-green-50 cursor-pointer transition">
                            <input type="radio" name="q${q.id}" value="${optIndex}" required class="h-4 w-4 text-green-600 focus:ring-green-500">
                            <span class="text-gray-700">${String.fromCharCode(65 + optIndex)}. ${opt}</span>
                        </label>
                    `;
                });

                card.innerHTML = `
                    <h3 class="text-lg font-bold text-gray-800 mb-3"><span class="text-green-600 mr-2">Q${index + 1}.</span>${q.q}</h3>
                    <div class="space-y-2 mb-4">
                        ${optionsHtml}
                    </div>
                    <div class="mt-4 bg-gray-50 p-4 rounded-md border border-gray-200">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">✍️ 請解釋選擇該答案的原因（自由作答）：</label>
                        <textarea id="reason${q.id}" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="例如：因為課本提到..."></textarea>
                    </div>
                `;
                quizContainer.appendChild(card);
            });
        }

        renderQuiz();

        // Handle Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get student info
            const name = document.getElementById('studentName').value.trim();
            const sClass = document.getElementById('studentClass').value.trim();
            const sNum = document.getElementById('studentNum').value.trim();
            
            // UI Loading state
            submitBtn.classList.add('btn-loading');
            submitBtn.disabled = true;

            let score = 0;
            let reportTextData = ''; // For Web3Forms Email (改為純文字)
            let uiResultsHtml = ''; // For Front-end display

            // Generate Plain Text for email report (純文字電郵標頭)
            reportTextData += `📊 光合作用測驗成績報告\n`;
            reportTextData += `========================\n`;
            reportTextData += `學生姓名：${name}\n`;
            reportTextData += `班別：${sClass}\n`;
            reportTextData += `學號：${sNum}\n`;
            reportTextData += `總分：{TOTAL_SCORE} / 10\n`;
            reportTextData += `========================\n\n`;

            questions.forEach((q, index) => {
                const selectedInput = document.querySelector(`input[name="q${q.id}"]:checked`);
                const studentAnsIndex = selectedInput ? parseInt(selectedInput.value) : -1;
                const reason = document.getElementById(`reason${q.id}`).value.trim() || "(沒有填寫原因)";
                
                const isCorrect = studentAnsIndex === q.ans;
                if (isCorrect) score++;

                const studentAnsText = studentAnsIndex >= 0 ? `${String.fromCharCode(65 + studentAnsIndex)}. ${q.options[studentAnsIndex]}` : "未作答";
                const correctAnsText = `${String.fromCharCode(65 + q.ans)}. ${q.options[q.ans]}`;

                // 將題目中的 HTML 標籤（如 <br>）轉換為純文字換行，方便電郵閱讀
                const plainQuestionText = q.q.replace(/<br>/g, '\n').replace(/&nbsp;/g, ' ');

                // --- Build Email Report Part (純文字格式) ---
                reportTextData += `Q${index + 1}. ${plainQuestionText}\n`;
                reportTextData += `學生答案：${studentAnsText} ${isCorrect ? '✅' : '❌'}\n`;
                if (!isCorrect) {
                    reportTextData += `正確答案：${correctAnsText}\n`;
                }
                reportTextData += `學生解釋：${reason}\n`;
                reportTextData += `🤖 AI 題解摘要：${q.ai}\n`;
                reportTextData += `------------------------\n\n`;

                // --- Build Front-end UI Part ---
                uiResultsHtml += `
                    <div class="p-6 rounded-lg border-2 ${isCorrect ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}">
                        <h4 class="font-bold text-gray-800 mb-2">Q${index + 1}. ${q.q}</h4>
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="font-semibold text-gray-700">你的答案：</span>
                            <span class="px-3 py-1 rounded-full text-sm font-bold ${isCorrect ? 'bg-green-200 text-green-800' : 'bg-red-200 text-red-800'}">
                                ${studentAnsText} ${isCorrect ? '✓' : '✗'}
                            </span>
                        </div>
                        ${!isCorrect ? `
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="font-semibold text-gray-700">正確答案：</span>
                                <span class="px-3 py-1 rounded-full text-sm font-bold bg-green-200 text-green-800">${correctAnsText}</span>
                            </div>
                        ` : ''}
                        <div class="mt-3 bg-white/60 p-3 rounded text-sm text-gray-600 italic border border-gray-200">
                            <strong>你的原因：</strong> ${reason}
                        </div>
                        <div class="mt-4 bg-white p-4 rounded-md shadow-sm border-l-4 border-blue-400">
                            <div class="flex items-center text-blue-700 font-bold mb-1">
                                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                AI 題解
                            </div>
                            <p class="text-gray-700 text-sm leading-relaxed">${q.ai}</p>
                        </div>
                    </div>
                `;
            });

            reportTextData = reportTextData.replace('{TOTAL_SCORE}', score);

            // Display UI Results instantly
            finalScoreEl.innerText = score;
            reportContainer.innerHTML = uiResultsHtml;
            form.style.display = 'none';
            resultsSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Send via Web3Forms
            const requestBody = {
                access_key: WEB3FORMS_ACCESS_KEY,
                subject: `[光合作用測驗] 成績報告 - ${sClass} ${name} (${score}/10)`,
                from_name: "AI 生物科測驗系統",
                to_email: TEACHER_EMAIL, 
                message: reportTextData // 這裡改為傳送純文字數據
            };

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    submissionStatus.innerHTML = `✅ 成績及 AI 報告已成功自動電郵至科主任 (<a href="mailto:${TEACHER_EMAIL}" class="text-blue-600 underline">${TEACHER_EMAIL}</a>)！請查閱下方題解。`;
                } else {
                    submissionStatus.innerHTML = `⚠️ 批改完成，但傳送成績至老師電郵時發生錯誤。請截圖此畫面交給老師。`;
                    submissionStatus.classList.add('text-red-600');
                }
            } catch (error) {
                console.error('Error submitting to Web3Forms:', error);
                submissionStatus.innerHTML = `⚠️ 批改完成，但網絡問題導致無法發送電郵。請截圖此畫面交給老師。`;
                submissionStatus.classList.add('text-red-600');
            } finally {
                // Reset button state (though form is hidden now)
                submitBtn.classList.remove('btn-loading');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
